name: PureGlass

options:
  bundleIdPrefix: com.giray.pureglass
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO

targets:
  PureGlass:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/DesignSystem
      - path: Sources/Features
      - path: Sources/Resources
    dependencies:
      - target: PureGlassKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giray.pureglass
        PRODUCT_NAME: PureGlass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Store DIŞI, non-sandboxed: Full Disk Access için zorunlu.
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: "PureGlass — lokalde çalışır, telemetri yok."
        INFOPLIST_KEY_NSMainNibFile: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  PureGlassKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giray.pureglass.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  PureGlassKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PureGlassKitTests
    dependencies:
      - target: PureGlassKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giray.pureglass.kit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PureGlass:
    build:
      targets:
        PureGlass: all
        PureGlassKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PureGlassKitTests
