name: PureGlass

options:
  bundleIdPrefix: com.giray.pureglass
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO

targets:
  PureGlass:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/DesignSystem
      - path: Sources/Features
      - path: Sources/Resources
    dependencies:
      - target: PureGlassKit
        embed: true
      - target: pgsmc          # build sırası için (Contents/MacOS'a postBuild ile kopyalanır)
    postBuildScripts:
      - name: Embed pgsmc helper
        script: |
          cp "${BUILT_PRODUCTS_DIR}/pgsmc" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/pgsmc"
          codesign --force --sign - "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/pgsmc"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giray.pureglass
        PRODUCT_NAME: PureGlass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Store DIŞI, non-sandboxed: Full Disk Access için zorunlu.
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: "PureGlass — lokalde çalışır, telemetri yok."
        INFOPLIST_KEY_NSMainNibFile: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  pgsmc:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Helper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giray.pureglass.pgsmc
        CODE_SIGN_IDENTITY: "-"

  PureGlassKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giray.pureglass.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  PureGlassKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PureGlassKitTests
    dependencies:
      - target: PureGlassKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giray.pureglass.kit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PureGlass:
    build:
      targets:
        PureGlass: all
        PureGlassKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PureGlassKitTests
